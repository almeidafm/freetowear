<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Account</title>
</head>
<body>
    <h1><a th:href="@{/}">Home</a><br></h1>

    <div>
        <span>👤</span>
        <span sec:authorize="isAnonymous()">Guest</span>
        <span sec:authorize="isAuthenticated()" th:text="${#authentication.principal.name}">User</span>
    </div><br>

    <form id="formUpdateAccount"
          th:action="@{/account}"
          method="post">

        <input type="hidden" name="_method" value="PATCH"/>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-grid">
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" placeholder="New name">
            </div>
            <div class="form-group">
                <label>CPF</label>
                <input type="text" name="cpf" placeholder="000.000.000-00">
            </div>
            <div class="form-group">
                <label>Birth Date</label>
                <input type="date" name="birthDate">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" placeholder="(11) 99999-9999">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
    </form><br>

    <form th:action="@{/account/email}" method="post">

        <input type="hidden"
               name="_method"
               value="PATCH"/>

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <div>
            <label>Email atual</label>
            <input type="email"
                   name="currentEmail"
                   required>
        </div>

        <div>
            <label>Senha</label>
            <input type="password"
                   name="password"
                   required>
        </div>

        <div>
            <label>Novo email</label>
            <input type="email"
                   name="newEmail"
                   required>
        </div>

        <button type="submit">Alterar email</button>
    </form><br>

    <form id="formAddAddress"
          th:action="@{/account/address}"
          method="post">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-grid">
            <div class="form-group">
                <label>CEP</label>
                <input type="text" name="cep" placeholder="00000-000" required>
            </div>
            <div class="form-group">
                <label>Street</label>
                <input type="text" name="street" placeholder="Rua das Flores" required>
            </div>
            <div class="form-group">
                <label>Number</label>
                <input type="text" name="number" placeholder="123">
            </div>
            <div class="form-group">
                <label>Complement</label>
                <input type="text" name="complement" placeholder="Apto 4B">
            </div>
            <div class="form-group">
                <label>Neighborhood</label>
                <input type="text" name="neighborhood" placeholder="Centro" required>
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" name="city" placeholder="São Paulo" required>
            </div>
            <div class="form-group">
                <label>State</label>
                <input type="text" name="state" placeholder="SP" maxlength="2" required>
            </div>
        </div>

        <div class="form-group">
            <label style="flex-direction:row;align-items:center;gap:8px;cursor:pointer">
                <input type="checkbox" name="defaultAddress" value="true" style="width:auto">
                Default address
            </label>
        </div>

        <button type="submit" class="btn btn-primary">Add Address</button>
    </form><br>

    <form id="formDeleteAccount"
          th:action="@{/account}"
          method="post">

        <input type="hidden" name="_method" value="DELETE"/>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-grid">
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password"/>
            </div>
        </div>

        <button type="submit" class="btn btn-danger">Delete Account</button>
    </form>

</body>
</html>
