<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

</head>
<body>
<h1><a></a></h1>

<div class="register-container">
    <h1><a th:href="@{/}">Home</a><br></h1>

    <div>
        <span>👤</span>
        <span sec:authorize="isAnonymous()">Guest</span>
        <span sec:authorize="isAuthenticated()" th:text="${#authentication.principal.name}">User</span>
    </div><br>

    <div th:if="${param.registered}" class="alert success">
        Account created successfully. Please log in.
    </div>
    <div class="register-card">
        <form method="post"
              th:action="@{/account/register}"
              th:object="${request}">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="name">Name</label>
                <input
                        id="name"
                        type="text"
                        th:field="*{name}"
                        placeholder="John Doe"
                        required>
                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                        id="email"
                        type="email"
                        th:field="*{email}"
                        placeholder="email@example.com"
                        required>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                        id="password"
                        type="password"
                        th:field="*{password}"
                        placeholder="••••••••"
                        required>
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-primary">
                Create Account
            </button>
        </form>

        <div class="login-link">
            <span>Already have an account?</span>
            <a th:href="@{/login}">Sign In</a>
        </div>
    </div>

</div>

</body>
</html>
