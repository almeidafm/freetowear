<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Payment</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/colors.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <th:block th:replace="~{layout/header :: header-assets}"></th:block>
    <th:block th:replace="~{layout/footer :: footer-assets}"></th:block>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<p th:if="${param.error}" style="color: red;">No active order found.</p>

<form th:action="@{/order/pay}" method="post">
    <button type="submit">PAY</button>
</form>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
