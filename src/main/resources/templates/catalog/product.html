<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Product</title>
</head>
<body>
<h1><a th:href="@{/}">Home</a><br></h1>

<div>
    <span>👤</span>
    <span sec:authorize="isAnonymous()">Guest</span>
    <span sec:authorize="isAuthenticated()" th:text="${#authentication.principal.name}">User</span>
</div><br>

<img th:src="${product.imageUrl}"
     th:alt="${product.name}"
     width="300">

<p>
    <strong>ID:</strong>
    <span th:text="${product.id}">1</span>
</p>

<p>
    <strong>Nome:</strong>
    <span th:text="${product.name}">Notebook</span>
</p>

<p>
    <strong>Categoria</strong>
    <span th:text="${product.categoryName}"> </span>
</p>

<p>
    <strong>Preço:</strong>
    <span th:text="${product.price}">1000.00</span>
</p>

<p>
    <strong>Descrição</strong>
    <span th:text="${product.description}"> </span>
</p>

<form th:action="@{/order/item}"
      method="post"
      enctype="multipart/form-data">

    <input type="hidden"
           name="idProduct"
           th:value="${product.id}">

    <fieldset>
        <legend>Variação</legend>
        <label th:each="variation : ${product.variations}">
            <input type="radio"
                   name="idVariation"
                   th:value="${variation.id}"
                   required>
            <span th:text="${variation.color + ' / ' + variation.size}">Cor / Tamanho</span>
        </label>
    </fieldset>

    <label for="quantity">
        Quantidade:
    </label>

    <input type="number"
           id="quantity"
           name="quantity"
           min="1"
           value="1"
           required>

    <br><br>

    <label for="customerCustomization">
        Personalização:
    </label>

    <input type="file"
           id="customerCustomization"
           name="customerCustomization">

    <br><br>

    <label for="description">
        Descrição:
    </label>

    <textarea id="description"
              name="description"></textarea>

    <br><br>

    <button type="submit">
        Adicionar ao carrinho
    </button>

</form>

<p>
    <a th:href="@{/products}">
        Voltar para a lista
    </a>
</p>
</body>
</html>
