<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Product</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/colors.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <th:block th:replace="~{layout/header :: header-assets}"></th:block>
    <th:block th:replace="~{layout/footer :: footer-assets}"></th:block>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="product-carousel" id="product-carousel">
    <div th:each="variation : ${product.variations}">
        <div class="product-slide" th:each="imageUrl : ${variation.imageUrls}">
            <img th:src="${imageUrl}" th:alt="${product.name}" width="300">
        </div>
    </div>
    <button type="button" id="previous-image">‹</button>
    <button type="button" id="next-image">›</button>
</div>

<style>
    .product-carousel { position: relative; width: 300px; }
    .product-slide { display: none; }
    .product-slide.active { display: block; }
    .product-carousel button { position: absolute; top: 45%; padding: .4rem .7rem; }
    #previous-image { left: .25rem; }
    #next-image { right: .25rem; }
</style>

<script>
    (() => {
        const slides = [...document.querySelectorAll('#product-carousel .product-slide')];
        let current = 0;
        const show = index => slides.forEach((slide, i) => slide.classList.toggle('active', i === index));
        if (slides.length) {
            show(current);
            document.getElementById('previous-image').onclick = () => { current = (current - 1 + slides.length) % slides.length; show(current); };
            document.getElementById('next-image').onclick = () => { current = (current + 1) % slides.length; show(current); };
        } else {
            document.getElementById('product-carousel').style.display = 'none';
        }
    })();
</script>

<p>
    <strong>ID:</strong>
    <span th:text="${product.id}">1</span>
</p>

<p>
    <strong>Nome:</strong>
    <span th:text="${product.name}">Notebook</span>
</p>

<p>
    <strong>Categoria</strong>
    <span th:text="${product.categoryName}"> </span>
</p>

<p>
    <strong>Preço:</strong>
    <span th:text="${product.price}">1000.00</span>
</p>

<p>
    <strong>Avaliação:</strong>
    <span th:text="${#numbers.formatDecimal(product.ratingAverage, 1, 2)}">0.00</span>
    <span>/ 5</span>
    <span th:text="${'(' + product.ratingCount + ' avaliações)'}">(0 avaliações)</span>
</p>

<p>
    <strong>Descrição</strong>
    <span th:text="${product.description}"> </span>
</p>

<form th:action="@{/order/item}"
      id="add-to-cart-form"
      method="post"
      enctype="multipart/form-data">

    <input type="hidden"
           name="idProduct"
           th:value="${product.id}">

    <fieldset>
        <legend>Variação</legend>
        <label th:each="variation : ${product.variations}">
            <input type="radio"
                   name="idVariation"
                   th:value="${variation.id}"
                   required>
            <span th:text="${variation.color + ' / ' + variation.size}">Cor / Tamanho</span>
        </label>
    </fieldset>

    <label for="quantity">
        Quantidade:
    </label>

    <input type="number"
           id="quantity"
           name="quantity"
           min="1"
           value="1"
           required>

    <br><br>

    <label for="customerCustomization">
        Personalização:
    </label>

    <input type="file"
           id="customerCustomization"
           name="customerCustomization">

    <br><br>

    <label for="description">
        Descrição:
    </label>

    <textarea id="description"
              name="description"></textarea>

    <br><br>

    <button type="submit">
        Adicionar ao carrinho
    </button>

</form>

<script>
    document.getElementById('add-to-cart-form').addEventListener('submit', async function (event) {
        event.preventDefault();

        try {
            const response = await fetch(this.action, {
                method: 'POST',
                body: new FormData(this)
            });
            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(data.message || 'Could not add item to cart.');
            }

            alert(data.message || 'Item added to cart successfully.');
        } catch (error) {
            alert(error.message || 'Could not add item to cart.');
        }
    });
</script>

<section>
    <h2>Avaliações dos clientes</h2>

    <p th:if="${#lists.isEmpty(reviews)}">Nenhuma avaliação ainda.</p>

    <article th:each="review : ${reviews}">
        <hr>
        <p>
            <strong th:text="${review.customerName}">Nome do cliente</strong>
            &mdash;
            <span th:text="${review.rating}">5</span>/5
            &mdash;
            <time th:datetime="${review.createdAt}"
                  th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy')}">01/01/2025</time>
        </p>

        <p th:if="${review.purchasedVariations != null and !#lists.isEmpty(review.purchasedVariations)}">
            <em>Comprou:
                <span th:each="variation, iterStat : ${review.purchasedVariations}">
                    <span th:text="${variation}">Cor / Tamanho</span><span th:if="${!iterStat.last}">, </span>
                </span>
            </em>
        </p>

        <p th:if="${review.text != null and !review.text.isBlank()}"
           th:text="${review.text}">Comentário do cliente.</p>

        <div th:if="${review.imageUrls != null and !#lists.isEmpty(review.imageUrls)}">
            <img th:each="url : ${review.imageUrls}"
                 th:src="${url}"
                 th:alt="${'Imagem da avaliação de ' + review.customerName}"
                 width="150">
        </div>
    </article>
</section>

<p>
    <a th:href="@{/products}">
        Voltar para a lista
    </a>
</p>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
