<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Categorias - FreeToWear</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/colors.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <th:block th:replace="~{layout/header :: header-assets}"></th:block>
    <th:block th:replace="~{layout/footer :: footer-assets}"></th:block>
</head>

<body>
<div th:replace="~{layout/header :: header}"></div>

<div>
    <span>👤</span>
    <span sec:authorize="isAnonymous()">Guest</span>
    <span sec:authorize="isAuthenticated()" th:text="${#authentication.principal.name}">User</span>
</div><br>

<h2>Categorias</h2>

<div th:if="${#lists.isEmpty(categories)}">
    <p>Nenhuma categoria encontrada.</p>
</div>

<ul th:unless="${#lists.isEmpty(categories)}">
    <li th:each="category : ${categories}">
        <a th:href="@{/categories/{id}(id=${category.id})}"
           th:text="${category.name}">
            Categoria
        </a>
    </li>
</ul>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
