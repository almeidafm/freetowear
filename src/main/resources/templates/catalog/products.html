<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Produtos</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/colors.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <th:block th:replace="~{layout/header :: header-assets}"></th:block>
    <th:block th:replace="~{layout/footer :: footer-assets}"></th:block>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<form th:action="@{/products/search}"
      method="get"
      class="search-form">

    <input type="search"
           name="q"
           placeholder="Buscar produtos ou categorias..."
           autocomplete="off">

    <button type="submit">
        Buscar
    </button>
</form><br>

<table border="1" cellpadding="10">
    <thead>
    <tr>
        <th>Image</th>
        <th>Name</th>
        <th>Price</th>
        <th>Detalhes</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="product : ${products}">
        <td>
            <img th:src="${product.imageUrl}"
                 th:alt="${product.name}"
                 width="120">
        </td>
        <td th:text="${product.name}"></td>
        <td th:text="'R$' + ${product.price}"></td>
        <td>
            <a th:href="@{/products/{id}(id=${product.id})}">
                Ver produto
            </a>
        </td>
    </tr>
    </tbody>
</table>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
