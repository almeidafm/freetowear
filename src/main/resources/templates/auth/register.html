<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#18191d">
    <title>Criar Conta — FreeToWear</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/colors.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <script defer th:src="@{/js/auth.js}"></script>
    <th:block th:replace="~{layout/announcement :: announcement-assets}"></th:block>
    <th:block th:replace="~{layout/header :: header-assets}"></th:block>
    <th:block th:replace="~{layout/footer :: footer-assets}"></th:block>
</head>
<body>

<div th:replace="~{layout/announcement :: announcement}"></div>
<div th:replace="~{layout/header :: header}"></div>

<main class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <span class="eyebrow">Cadastro</span>
            <h1>CRIAR CONTA</h1>
            <p>Cadastre-se para salvar suas criações, acompanhar pedidos e personalizar camisetas.</p>
        </div>

        <div th:if="${param.registered}" class="auth-alert success">Conta criada com sucesso! Faça login para continuar.</div>
        <div th:if="${alreadyLoggedIn}" class="auth-alert">Você já está conectado. Encerre sua sessão antes de criar uma nova conta.</div>

        <form th:unless="${alreadyLoggedIn}" method="post" th:action="@{/account/register}" th:object="${request}" class="auth-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="auth-form-group">
                <label for="name">Nome completo</label>
                <input id="name" type="text" th:field="*{name}" placeholder="Seu nome" required autofocus>
                <div class="auth-field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="auth-form-group">
                <label for="email">E-mail</label>
                <input id="email" type="email" th:field="*{email}" placeholder="seu@email.com" required>
                <div class="auth-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="auth-form-group">
                <label for="password">Senha</label>
                <input id="password" type="password" th:field="*{password}" placeholder="••••••••" required>
                <div class="auth-field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="auth-form-group">
                <label class="auth-form-checkbox" for="termsAccepted">
                    <input id="termsAccepted" type="checkbox" th:field="*{termsAccepted}" required>
                    <span>Concordo com os <a href="#termsModal" id="termsLink">Termos de Uso</a></span>
                </label>
                <div class="auth-field-error" th:if="${#fields.hasErrors('termsAccepted')}" th:errors="*{termsAccepted}"></div>

                <label class="auth-form-checkbox" for="privacyAccepted">
                    <input id="privacyAccepted" type="checkbox" th:field="*{privacyAccepted}" required>
                    <span>Declaro estar ciente da <a href="#privacyModal" id="privacyLink">Política de Privacidade</a></span>
                </label>
                <div class="auth-field-error" th:if="${#fields.hasErrors('privacyAccepted')}" th:errors="*{privacyAccepted}"></div>
            </div>

            <button type="submit" class="auth-submit-btn">
                Criar Conta
                <svg class="ftw-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M5 19 19 5M5 5h14v14" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/>
                </svg>
            </button>
        </form>

        <div class="auth-links" th:unless="${alreadyLoggedIn}">
            <div>
                <span>Já possui uma conta?</span>
                <a th:href="@{/login}">Entrar</a>
            </div>
        </div>
    </div>
</main>

<div id="termsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="termsModalTitle" hidden>
    <div class="modal-content">
        <button type="button" class="modal-close" id="closeTermsModal" aria-label="Fechar termos">&times;</button>
        <iframe th:src="@{/terms}" id="termsFrame" title="Termos e Condições"></iframe>
        <div class="modal-actions">
            <button type="button" id="confirmTermsRead" disabled>Confirmar leitura</button>
        </div>
    </div>
</div>

<div id="privacyModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="privacyModalTitle" hidden>
    <div class="modal-content">
        <button type="button" class="modal-close" id="closePrivacyModal" aria-label="Fechar política de privacidade">&times;</button>
        <iframe th:src="@{/privacy}" id="privacyFrame" title="Política de Privacidade"></iframe>
        <div class="modal-actions">
            <button type="button" id="confirmPrivacyRead" disabled>Confirmar leitura</button>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
