<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        .modal[hidden] { display: none; }
        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: grid;
            place-items: center;
            background: rgba(0, 0, 0, .6);
        }
        .modal-content {
            position: relative;
            width: min(700px, 90vw);
            height: min(80vh, 700px);
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
        }
        .modal-content iframe {
            width: 100%;
            height: calc(100% - 56px);
            border: 0;
        }
        .modal-actions {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 16px;
            box-sizing: border-box;
        }
        .modal-actions button:disabled { cursor: not-allowed; opacity: .5; }
        .modal-close {
            position: absolute;
            top: 8px;
            right: 12px;
            z-index: 1;
            border: 0;
            background: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h1><a></a></h1>

<div class="register-container">
    <h1><a th:href="@{/}">Home</a><br></h1>

    <div>
        <span>👤</span>
        <span sec:authorize="isAnonymous()">Guest</span>
        <span sec:authorize="isAuthenticated()" th:text="${#authentication.principal.name}">User</span>
    </div><br>

    <div th:if="${param.registered}" class="alert success">
        Account created successfully. Please log in.
    </div>
    <div class="register-card">
        <div th:if="${alreadyLoggedIn}" class="alert">
            You are already logged in. Please log out before creating a new account.
        </div>

        <form th:unless="${alreadyLoggedIn}" method="post"
              th:action="@{/account/register}"
              th:object="${request}">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="name">Name</label>
                <input
                        id="name"
                        type="text"
                        th:field="*{name}"
                        placeholder="John Doe"
                        required>
                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                        id="email"
                        type="email"
                        th:field="*{email}"
                        placeholder="email@example.com"
                        required>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                        id="password"
                        type="password"
                        th:field="*{password}"
                        placeholder="••••••••"
                        required>
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="form-group">
                <label for="termsAccepted">
                    <input
                            id="termsAccepted"
                            type="checkbox"
                            th:field="*{termsAccepted}"
                            required>
                    Concordo com os
                    <a href="#termsModal" id="termsLink">Termos e Condições</a>
                </label>
                <div th:if="${#fields.hasErrors('termsAccepted')}"
                     th:errors="*{termsAccepted}">
                </div>

                <label for="privacyAccepted">
                    <input
                            id="privacyAccepted"
                            type="checkbox"
                            th:field="*{privacyAccepted}"
                            required>
                    Declaro estar ciente da
                    <a href="#privacyModal" id="privacyLink">Política de Privacidade</a>.
                </label>

                <div th:if="${#fields.hasErrors('privacyAccepted')}"
                     th:errors="*{privacyAccepted}">
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                Create Account
            </button>
        </form>

        <div class="login-link" th:unless="${alreadyLoggedIn}">
            <span>Already have an account?</span>
            <a th:href="@{/login}">Sign In</a>
        </div>
    </div>

</div>

<div id="termsModal" class="modal" role="dialog" aria-modal="true"
     aria-labelledby="termsModalTitle" hidden>
    <div class="modal-content">
        <button type="button" class="modal-close" id="closeTermsModal"
                aria-label="Close terms">&times;</button>
        <iframe th:src="@{/terms}" id="termsFrame" title="Termos e Condições"></iframe>
        <div class="modal-actions">
            <button type="button" id="confirmTermsRead" disabled>
                Confirmar leitura
            </button>
        </div>
    </div>
</div>

<div id="privacyModal" class="modal" role="dialog" aria-modal="true"
     aria-labelledby="privacyModalTitle" hidden>
    <div class="modal-content">
        <button type="button" class="modal-close" id="closePrivacyModal"
                aria-label="Close privacy policy">&times;</button>
        <iframe th:src="@{/privacy}" id="privacyFrame"
                title="Política de Privacidade"></iframe>
        <div class="modal-actions">
            <button type="button" id="confirmPrivacyRead" disabled>
                Confirmar leitura
            </button>
        </div>
    </div>
</div>

<script>
    (() => {
        const termsLink = document.getElementById('termsLink');
        const termsModal = document.getElementById('termsModal');
        const closeTermsModal = document.getElementById('closeTermsModal');
        const termsFrame = document.getElementById('termsFrame');
        const termsCheckbox = document.getElementById('termsAccepted');
        const confirmTermsRead = document.getElementById('confirmTermsRead');
        const privacyLink = document.getElementById('privacyLink');
        const privacyModal = document.getElementById('privacyModal');
        const closePrivacyModal = document.getElementById('closePrivacyModal');
        const privacyFrame = document.getElementById('privacyFrame');
        const privacyCheckbox = document.getElementById('privacyAccepted');
        const confirmPrivacyRead = document.getElementById('confirmPrivacyRead');

        let termsConfirmed = false;
        let privacyConfirmed = false;

        termsCheckbox.addEventListener('click', (event) => {
            if (!termsConfirmed) {
                event.preventDefault();
                alert('Você precisa ler e confirmar os Termos e Condições antes de aceitá-los.');
                termsLink.focus();
            }
        });

        termsLink.addEventListener('click', (event) => {
            event.preventDefault();
            termsModal.hidden = false;
            closeTermsModal.focus();
        });

        closeTermsModal.addEventListener('click', () => {
            termsModal.hidden = true;
        });

        termsModal.addEventListener('click', (event) => {
            if (event.target === termsModal) {
                termsModal.hidden = true;
            }
        });

        termsFrame.addEventListener('load', () => {
            const termsDocument = termsFrame.contentDocument;
            const termsWindow = termsFrame.contentWindow;

            termsDocument.addEventListener('scroll', () => {
                const reachedBottom = termsWindow.scrollY + termsWindow.innerHeight
                    >= termsDocument.documentElement.scrollHeight - 8;

                if (reachedBottom) {
                    confirmTermsRead.disabled = false;
                }
            });
        });

        confirmTermsRead.addEventListener('click', () => {
            termsConfirmed = true;
            termsModal.hidden = true;
            termsCheckbox.focus();
        });

        privacyCheckbox.addEventListener('click', (event) => {
            if (!privacyConfirmed) {
                event.preventDefault();
                alert('Você precisa ler e confirmar a Política de Privacidade antes de aceitá-la.');
                privacyLink.focus();
            }
        });

        privacyLink.addEventListener('click', (event) => {
            event.preventDefault();
            privacyModal.hidden = false;
            closePrivacyModal.focus();
        });

        closePrivacyModal.addEventListener('click', () => {
            privacyModal.hidden = true;
        });

        privacyModal.addEventListener('click', (event) => {
            if (event.target === privacyModal) {
                privacyModal.hidden = true;
            }
        });

        privacyFrame.addEventListener('load', () => {
            const privacyDocument = privacyFrame.contentDocument;
            const privacyWindow = privacyFrame.contentWindow;

            privacyDocument.addEventListener('scroll', () => {
                const reachedBottom = privacyWindow.scrollY + privacyWindow.innerHeight
                    >= privacyDocument.documentElement.scrollHeight - 8;

                if (reachedBottom) {
                    confirmPrivacyRead.disabled = false;
                }
            });
        });

        confirmPrivacyRead.addEventListener('click', () => {
            privacyConfirmed = true;
            privacyModal.hidden = true;
            privacyCheckbox.focus();
        });
    })();
</script>

</body>
</html>
