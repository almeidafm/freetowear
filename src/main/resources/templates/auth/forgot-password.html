<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Recuperar Senha - FreeToWear</title>
    <style>
        .step { display: none; }
        .step.active { display: block; }
        .error { color: red; font-size: 0.9em; margin-top: 5px; }
        .success { color: green; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>
<h1><a th:href="@{/}">Home</a><br></h1>

<h2>Recuperar Senha</h2>

<div id="step1" class="step active">
    <span>Digite seu E-mail</span><br>
    <input type="email" id="emailInput" placeholder="example@mail.com" required><br>
    <button type="button" onclick="requestCode()">Enviar Código</button>
    <p id="step1Message" class="error"></p>
</div>

<div id="step2" class="step">
    <span>Digite o código enviado para <strong id="displayEmail"></strong></span><br>
    <input type="text" id="codeInput" placeholder="Ex: 123456" maxlength="6" required><br>
    <button type="button" onclick="verifyCode()">Verificar Código</button>
    <p id="step2Message" class="error"></p>
    <button type="button" onclick="goToStep(1)" style="margin-top:10px; background:none; border:none; text-decoration:underline; color:blue;">Voltar</button>
</div>

<div id="step3" class="step">
    <span>Digite sua nova senha</span><br>
    <input type="password" id="newPasswordInput" placeholder="Nova senha" required><br>
    <input type="password" id="confirmPasswordInput" placeholder="Confirmar nova senha" required><br>
    <button type="button" onclick="resetPassword()">Alterar Senha</button>
    <p id="step3Message" class="error"></p>
</div>

<script>
    let userEmail = "";

    function goToStep(stepNumber) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + stepNumber).classList.add('active');
        document.querySelectorAll('[id$="Message"]').forEach(el => el.textContent = "");
    }

    async function requestCode() {
        userEmail = document.getElementById('emailInput').value;
        const msgEl = document.getElementById('step1Message');

        if (!userEmail.includes('@')) {
            msgEl.textContent = "Por favor, insira um e-mail válido.";
            return;
        }

        try {
            const response = await fetch('/password/request-code', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [document.querySelector('meta[name="_csrf_header"]').content]:
                    document.querySelector('meta[name="_csrf"]').content
                },
                body: JSON.stringify({ contact: userEmail })
            });

            if (response.ok) {
                document.getElementById('displayEmail').textContent = userEmail;
                goToStep(2);
            } else {
                msgEl.textContent = "Erro ao enviar código. Tente novamente.";
            }
        } catch (error) {
            msgEl.textContent = "Erro de conexão.";
        }
    }

    async function verifyCode() {
        const code = document.getElementById('codeInput').value;
        const msgEl = document.getElementById('step2Message');

        try {
            const response = await fetch('/password/verify-code', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [document.querySelector('meta[name="_csrf_header"]').content]:
                    document.querySelector('meta[name="_csrf"]').content
                },
                body: JSON.stringify({ contact: userEmail, code: code })
            });

            if (response.ok) {
                goToStep(3);
            } else {
                const data = await response.json();
                msgEl.textContent = data.message || "Código inválido ou expirado.";
            }
        } catch (error) {
            msgEl.textContent = "Erro de conexão.";
        }
    }

    async function resetPassword() {
        const newPass = document.getElementById('newPasswordInput').value;
        const confirmPass = document.getElementById('confirmPasswordInput').value;
        const code = document.getElementById('codeInput').value;
        const msgEl = document.getElementById('step3Message');

        if (newPass.length < 6) {
            msgEl.textContent = "A senha deve ter pelo menos 6 caracteres.";
            return;
        }
        if (newPass !== confirmPass) {
            msgEl.textContent = "As senhas não coincidem.";
            return;
        }

        try {
            const response = await fetch('/password/reset', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [document.querySelector('meta[name="_csrf_header"]').content]:
                    document.querySelector('meta[name="_csrf"]').content
                },
                body: JSON.stringify({
                    contact: userEmail,
                    code: code,
                    newPassword: newPass
                })
            });

            if (response.ok) {
                msgEl.className = "success";
                msgEl.textContent = "Senha alterada com sucesso! Redirecionando para o login...";
                setTimeout(() => {
                    window.location.href = "/login";
                }, 2000);
            } else {
                const data = await response.json();
                msgEl.textContent = data.message || "Erro ao redefinir a senha.";
            }
        } catch (error) {
            msgEl.textContent = "Erro de conexão.";
        }
    }
</script>
</body>
</html>
