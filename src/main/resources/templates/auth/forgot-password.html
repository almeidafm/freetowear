<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Recuperar Senha - FreeToWear</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/colors.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">
    <th:block th:replace="~{layout/header :: header-assets}"></th:block>
    <th:block th:replace="~{layout/footer :: footer-assets}"></th:block>
    <script defer th:src="@{/js/forgot-password.js}"></script>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="forgot-password-page">
<div class="forgot-password-card">
    <div class="forgot-password-header">
        <p class="eyebrow">Acesso à conta</p>
        <h1>Recuperar senha</h1>
        <p>Redefina sua senha com segurança em poucos passos.</p>
    </div>

<div id="step1" class="step active forgot-password-step">
    <span>Digite seu E-mail</span><br>
    <input type="email" id="emailInput" placeholder="example@mail.com" required><br>
    <button type="button" onclick="requestCode()">Enviar Código</button>
    <p id="step1Message" class="error"></p>
</div>

<div id="step2" class="step forgot-password-step">
    <span>Digite o código enviado para <strong id="displayEmail"></strong></span><br>
    <input type="text" id="codeInput" placeholder="Ex: 123456" maxlength="6" required><br>
    <button type="button" onclick="verifyCode()">Verificar Código</button>
    <p id="step2Message" class="error"></p>
    <button type="button" onclick="goToStep(1)" style="margin-top:10px; background:none; border:none; text-decoration:underline; color:blue;">Voltar</button>
</div>

<div id="step3" class="step forgot-password-step">
    <span>Digite sua nova senha</span><br>
    <input type="password" id="newPasswordInput" placeholder="Nova senha" required><br>
    <input type="password" id="confirmPasswordInput" placeholder="Confirmar nova senha" required><br>
    <button type="button" onclick="resetPassword()">Alterar Senha</button>
    <p id="step3Message" class="error"></p>
</div>
</div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
