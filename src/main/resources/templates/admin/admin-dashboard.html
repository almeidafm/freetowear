<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>FreeToWear — Analytics &amp; Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
</head>
<body>
<header>
    <div class="header-copy">
        <p class="eyebrow"><a th:href="@{/admin}">&larr; FreeToWear Admin</a></p>
        <h1 id="pageTitle">Analytics &amp; Dashboard</h1>
        <p class="m">Métricas em tempo real da loja</p>
    </div>
    <div class="top-actions">
        <div class="period-wrap">
            <label for="pd">Período</label>
            <select id="pd">
                <option value="7">Últimos 7 dias</option>
                <option value="30" selected>Últimos 30 dias</option>
                <option value="90">Últimos 90 dias</option>
                <option value="365">Últimos 12 meses</option>
            </select>
        </div>
    </div>
</header>
<main id="dashboardMain">
    <section id="dashboard" aria-label="Indicadores e gráficos">
        <div class="loading-state">Carregando métricas...</div>
    </section>
    <p class="footer-note">FreeToWear Analytics · Dados atualizados em tempo real a partir da base de dados</p>
</main>
<script th:src="@{/js/admin-dashboard.js}"></script>
</body>
</html>
