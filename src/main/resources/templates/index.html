<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
<h1>FreeToWear - Home</h1>

<div>
    <span>👤</span>
    <span sec:authorize="isAnonymous()">Guest</span>
    <span sec:authorize="isAuthenticated()" th:text="${#authentication.principal.name}">User</span>
</div><br>

<a th:href="@{/register}">Register</a><br>
<a th:href="@{/login}">Login</a><br>
<a th:href="@{/account}">Account</a><br>
<a th:href="@{/products}">Products</a><br>
<a th:href="@{/categories}">Categories</a><br>
<a th:href="@{/products/search}">Search Products</a><br>
<a th:href="@{/cart}">Cart</a><br>
<a th:href="@{/checkout}">Checkout</a><br>
<a th:href="@{/test}">Test</a>

</body>
</html>
